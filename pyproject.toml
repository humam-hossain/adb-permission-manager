[project]
name = "adb-permission-manager"
version = "1.0.0"
description = "Interactive terminal tool for managing Android app permissions via ADB"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "rich>=13.0",
]

[project.scripts]
adb-perms = "adb_permission_manager.perm_manager:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adb_permission_manager"]
