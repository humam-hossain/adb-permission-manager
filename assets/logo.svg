<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="android-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3DDC84" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#10B981" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Outer Rounded Squircle -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bg-grad)" stroke="#334155" stroke-width="2" />

  <!-- Shield Shape in Center with Subtle Glow -->
  <path d="M64 22 L94 36 V62 C94 82 81 99 64 106 C47 99 34 82 34 62 V36 L64 22 Z"
        fill="#1E293B" stroke="url(#android-grad)" stroke-width="3" stroke-linejoin="round" filter="url(#glow)" />

  <!-- Inner Terminal / ADB Prompt & Key Symbol -->
  <!-- Top Android Antennae -->
  <line x1="51" y1="42" x2="45" y2="34" stroke="#3DDC84" stroke-width="2.5" stroke-linecap="round" />
  <line x1="77" y1="42" x2="83" y2="34" stroke="#3DDC84" stroke-width="2.5" stroke-linecap="round" />

  <!-- Android Dome -->
  <path d="M47 54 C47 44.6 54.6 37 64 37 C73.4 37 81 44.6 81 54 Z" fill="url(#android-grad)" />

  <!-- Android Eyes -->
  <circle cx="54" cy="46" r="2.2" fill="#0F172A" />
  <circle cx="74" cy="46" r="2.2" fill="#0F172A" />

  <!-- Terminal & Lock Emblem on Shield Base -->
  <!-- Command Prompt Symbol '>_' -->
  <path d="M48 68 L56 74 L48 80" stroke="#38BDF8" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="60" y1="80" x2="70" y2="80" stroke="#38BDF8" stroke-width="2.8" stroke-linecap="round" />

  <!-- Checkmark / Toggle Badge -->
  <circle cx="79" cy="74" r="8" fill="#10B981" />
  <path d="M75 74 L78 77 L83 71" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
</svg>
